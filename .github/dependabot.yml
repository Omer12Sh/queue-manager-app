version: 2
updates:
  # Root npm workspace
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    groups:
      dev-dependencies:
        dependency-type: 'development'
    labels:
      - 'dependencies'
      - 'npm'

  # Backend
  - package-ecosystem: 'npm'
    directory: '/backend'
    schedule:
      interval: 'weekly'
      day: 'monday'
    groups:
      prisma:
        patterns:
          - 'prisma'
          - '@prisma/*'
      express:
        patterns:
          - 'express'
          - '@types/express'
    labels:
      - 'dependencies'
      - 'backend'

  # Frontend
  - package-ecosystem: 'npm'
    directory: '/frontend'
    schedule:
      interval: 'weekly'
      day: 'monday'
    groups:
      react:
        patterns:
          - 'react'
          - 'react-*'
          - '@types/react*'
      vite:
        patterns:
          - 'vite'
          - '@vitejs/*'
    labels:
      - 'dependencies'
      - 'frontend'

  # Mobile
  - package-ecosystem: 'npm'
    directory: '/mobile'
    schedule:
      interval: 'weekly'
      day: 'monday'
    groups:
      expo:
        patterns:
          - 'expo'
          - 'expo-*'
          - '@expo/*'
      react-native:
        patterns:
          - 'react-native'
          - 'react-native-*'
          - '@react-native*'
    labels:
      - 'dependencies'
      - 'mobile'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'github-actions'
